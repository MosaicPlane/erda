name: Publish community backend image to ACR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE_REPOSITORY: registry.cn-beijing.aliyuncs.com/myerda/erda

jobs:
  publish:
    name: Build, publish, and record evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required ACR secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "${ACR_USERNAME}"
          test -n "${ACR_PASSWORD}"

      - name: Install policy tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Verify community image policy
        run: bash build/scripts/tests/community_image_test.sh

      - name: Resolve immutable image metadata
        id: image
        shell: bash
        run: |
          revision="${GITHUB_SHA}"
          tag="sha-${revision:0:12}"
          image="${IMAGE_REPOSITORY}:${tag}"
          epoch="$(git show -s --format=%ct "${revision}")"
          printf 'revision=%s\n' "${revision}" >>"${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >>"${GITHUB_OUTPUT}"
          printf 'image=%s\n' "${image}" >>"${GITHUB_OUTPUT}"
          printf 'epoch=%s\n' "${epoch}" >>"${GITHUB_OUTPUT}"

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build reproducible linux/amd64 image
        env:
          VCS_REF: ${{ steps.image.outputs.revision }}
          SOURCE_DATE_EPOCH: ${{ steps.image.outputs.epoch }}
          OUTPUT_IMAGE: ${{ steps.image.outputs.image }}
          EMBEDDED_IMAGE: ${{ steps.image.outputs.image }}
          COMMUNITY_GO_BUILD_PARALLELISM: "1"
          COMMUNITY_GO_MAX_PROCS: "2"
        run: bash build/scripts/community_image.sh

      - name: Push image and resolve remote digest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          docker push "${IMAGE}"
          digest="$(docker buildx imagetools inspect "${IMAGE}" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"
          printf '%s\n' "${digest}" >digest.txt

      - name: Generate SPDX SBOM from published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan published digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: json
          output: trivy.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Record release evidence
        env:
          REVISION: ${{ steps.image.outputs.revision }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -n \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg commit "${REVISION}" \
            --arg image "${IMAGE_REPOSITORY}" \
            --arg tag "${TAG}" \
            --arg digest "${DIGEST}" \
            '{schema: 1, source: $source, commit: $commit, image: $image,
              tag: $tag, digest: $digest, platform: "linux/amd64",
              sbom: "sbom.spdx.json", vulnerabilityReport: "trivy.json"}' \
            >evidence.json

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-erda-${{ steps.image.outputs.tag }}
          path: |
            evidence.json
            digest.txt
            sbom.spdx.json
            trivy.json
          if-no-files-found: error
          retention-days: 30
